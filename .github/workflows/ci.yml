name: Validate application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Backend and credential security tests
        run: python -m pytest -q
      - name: Publication safety checks
        run: python scripts/verify-publication.py
      - name: Frontend build
        run: |
          npm ci --prefix apps/web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Browser workflows
        run: |
          python -m venv .venv --system-site-packages
          npm --prefix apps/web run test:e2e
      - name: Infrastructure checks
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: ap-south-1
        run: |
          npm ci --prefix infra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package-lambda.ps1
          npm --prefix infra run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix infra run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix infra run synth
